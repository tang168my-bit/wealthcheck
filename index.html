<!doctype html>
<html lang="zh-HK">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="財富體檢">

<style>
/* Layout: sticky ledger bar on top, one centered working column, bottom step bar; results split into fixed controls + live output */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --sunk:#eef2ee; --ink:#17221e; --muted:#5b6a64; --line:#dce3dd;
  --accent:#1d5b49; --accent-ink:#ffffff; --accent-soft:#e1ede8; --gold:#a8792a; --gold-soft:#f3ead9;
  --risk:#b23a2e; --risk-soft:#f6e3e0; --warn:#b97f0f; --warn-soft:#f7edd6; --good:#2c7650; --good-soft:#e0efe6;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --sunk:#151c1a; --ink:#e5ece8; --muted:#97a69f; --line:#2b3632;
  --accent:#6dbd9f; --accent-ink:#0f1a16; --accent-soft:#1d332c; --gold:#d6a752; --gold-soft:#33291a;
  --risk:#e36d5e; --risk-soft:#3a2220; --warn:#e2ab3c; --warn-soft:#352b17; --good:#61c08b; --good-soft:#1c3226; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --sunk:#151c1a; --ink:#e5ece8; --muted:#97a69f; --line:#2b3632;
  --accent:#6dbd9f; --accent-ink:#0f1a16; --accent-soft:#1d332c; --gold:#d6a752; --gold-soft:#33291a;
  --risk:#e36d5e; --risk-soft:#3a2220; --warn:#e2ab3c; --warn-soft:#352b17; --good:#61c08b; --good-soft:#1c3226; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media print{.bar,.foot,.toast,.noprint{display:none!important} body{background:#fff} main{padding:0} .card{break-inside:avoid;animation:none;border-color:#ccc}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.who{color:var(--muted);font-size:14px;min-width:0;flex:1 1 160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.tab[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}

main{max-width:1000px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.sunk{background:var(--sunk)}
.lead{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .lab{font-size:14px;color:var(--muted)}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px}
textarea{min-height:140px;font-family:var(--f-num);font-size:14px;line-height:1.5}
.unit{position:relative}
.unit input{padding-right:58px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;min-height:46px}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--risk);border-color:var(--risk)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--sunk);color:var(--muted)}
.pill.ex{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--risk-soft);color:var(--risk)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20}

.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:38px}
.step[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot-in{max-width:1000px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}

.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.opt b{font-family:var(--f-display);font-size:17px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.clients{display:flex;flex-direction:column;gap:8px}
.client{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);flex-wrap:wrap}
.client .nm{font-weight:600;min-width:0}

.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{border-radius:var(--r);padding:16px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--f-num);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:13px;color:var(--muted)}
.tile.bad{background:var(--risk-soft);border-color:transparent}.tile.bad .v{color:var(--risk)}
.tile.mid{background:var(--warn-soft);border-color:transparent}.tile.mid .v{color:var(--warn)}
.tile.ok{background:var(--good-soft);border-color:transparent}.tile.ok .v{color:var(--good)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:6px;margin-right:10px;white-space:nowrap}
.src::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.src.in{--c:#3b6ea8}.src.calc{--c:var(--muted)}.src.asm{--c:var(--gold)}
.eyebrow .src{margin:0 0 0 8px;vertical-align:middle}
.srcleg{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}
.scen-t{width:100%;border-collapse:collapse;font-size:15px}
.scen-t th,.scen-t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.scen-t th:first-child,.scen-t td:first-child{text-align:left}
.scen-t td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.scen-t td:first-child{font-family:var(--f-body)}
.scen-t tr.cur td{background:var(--accent-soft);font-weight:600}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.slider{display:flex;flex-direction:column;gap:6px;min-width:0}
.slider .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.slider .top b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:13px}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.t{font-family:var(--f-body)}
.asset{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.asset .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.reco{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:r}
.reco li{display:flex;gap:12px;align-items:flex-start}
.reco li::before{counter-increment:r;content:counter(r);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-num);font-size:14px}
.summary p{margin:0;font-size:17px;max-width:65ch}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg)}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.ovr{display:grid;grid-template-columns:minmax(110px,1fr) 70px 110px minmax(140px,2fr);gap:8px;align-items:center;font-size:14px}
@media (max-width:560px){.ovr{grid-template-columns:1fr 60px 90px}.ovr .rs{grid-column:1/-1}}
.confirm{border:1px solid var(--risk);background:var(--risk-soft);border-radius:10px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<body>



<div class="bar"><div class="bar-in" id="bar"></div></div>
<main id="app"></main>
<div class="foot" id="foot" hidden><div class="foot-in" id="footIn"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/*CALC-START*/
const LIQ = {A:'即時／7天內',B:'30天內',C:'3–12個月',D:'1年以上／不確定'};
const CATS = ['現金存款','股票基金債券','上市股權','非上市股權（本企業）','投資房產','自住房產','儲蓄保單現金價值','私募／其他'];
const LOCS = ['內地','香港','海外'];
const POOLS = {safe:'安全池',growth:'增值池',legacy:'傳承池',home:'自住資產',business:'企業（牆外）'};

function gpv(P0,g,r,n,d,begin){ // growing payments, today's-value P0, deferred d years, version A
  g/=100; r/=100; let s=0;
  for(let k=1;k<=n;k++){ const t = begin ? d+k-1 : d+k; s += P0*Math.pow(1+g,t)/Math.pow(1+r,t); }
  return s;
}
function rOf(c){ return c.as.r[c.as.scen]; }
function rateOf(c,ccy){ return ccy==='USD'?1:(c.fx[ccy]||1); }
function assetUSD(c,a){ return (+a.v||0)*10000/rateOf(c,a.ccy); }
function poolOf(a){
  if(a.pool && a.pool!=='auto') return a.pool;
  if(a.owner==='company') return 'business';
  switch(a.cat){
    case '現金存款': return 'safe';
    case '非上市股權（本企業）': return 'business';
    case '自住房產': return 'home';
    case '儲蓄保單現金價值': return 'legacy';
    case '上市股權': return a.biz ? 'business' : 'growth';
    default: return 'growth';
  }
}
function factorOf(a){
  if(a.biz || a.cat==='非上市股權（本企業）') return '本業相關';
  if(a.cat==='現金存款') return null;
  if(a.cat==='儲蓄保單現金價值') return null;
  if(a.cat==='投資房產'||a.cat==='自住房產') return '房地產';
  if(a.cat==='股票基金債券'||a.cat==='上市股權') return '金融市場';
  return '其他';
}
function irr(cfs){
  const npv = x => cfs.reduce((s,v,t)=>s+v/Math.pow(1+x,t),0);
  let lo=-0.95, hi=1, flo=npv(lo), fhi=npv(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0) return null;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2, fm=npv(m); if(Math.abs(fm)<1e-9) return m; if(flo*fm<0){hi=m;fhi=fm}else{lo=m;flo=fm} }
  return (lo+hi)/2;
}
function parsePlan(text){
  const rows=[];
  (text||'').split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    let parts = line.includes('\t') ? line.split('\t') : line.split(/[\s,，]+/);
    parts = parts.map(p=>p.replace(/[,$¥￥\s]/g,'')).filter(p=>p!=='');
    const n = parts.map(Number);
    if(n.length<4 || n.slice(0,4).some(x=>!isFinite(x))) return;
    rows.push({y:n[0],prem:n[1]||0,wd:n[2]||0,cv:n[3]||0,db:isFinite(n[4])?n[4]:0});
  });
  rows.sort((a,b)=>a.y-b.y);
  return rows;
}
function planStats(rows){
  if(!rows.length) return null;
  const maxY = rows[rows.length-1].y, byY={};
  rows.forEach(r=>byY[r.y]=r);
  const out=[]; let cumP=0,cumW=0,breakeven=null;
  for(let Y=1;Y<=maxY;Y++){
    const r=byY[Y]||{prem:0,wd:0,cv:null,db:null};
    cumP+=r.prem; cumW+=r.wd;
    if(!byY[Y]) continue;
    const cf=new Array(Y+1).fill(0);
    for(let k=1;k<=Y;k++){ const q=byY[k]; if(q){ cf[k-1]-=q.prem; cf[k]+=q.wd; } }
    const cs=cf.slice(), cd=cf.slice(); cs[Y]+=r.cv; cd[Y]+=r.db;
    const total = r.cv + cumW;
    if(breakeven===null && cumP>0 && total>=cumP) breakeven=Y;
    out.push({y:Y,cumP,cumW,cv:r.cv,db:r.db,irrS:irr(cs),irrD:r.db?irr(cd):null,lev:cumP?r.db/cumP:null,mult:cumP?total/cumP:null});
  }
  const prem1 = rows.find(r=>r.prem>0);
  return {years:out,breakeven,annualPrem:prem1?prem1.prem:0};
}

function compute(c){
  const b=c.basic, as=c.as, r=rOf(c), beg=as.begin, spendY=b.spend*12, incY=b.income*12, R={};
  R.r=r;
  // Level 1
  R.monthsL1 = b.spend>0 ? b.savings/b.spend : 0;
  R.pp = [10,20,30].map(t=>({t,v:b.savings/Math.pow(1+as.gL/100,t)}));
  // compounding lines
  const end = Math.max(c.l1.toAge, b.age+1), save=c.l1.monthly*12, start=c.l1.startAge;
  const lines={dep:[],now:[],late:[]}; let d=b.savings,n=b.savings,l=b.savings;
  for(let age=b.age; age<=end; age++){
    lines.dep.push({x:age,y:d}); lines.now.push({x:age,y:n}); lines.late.push({x:age,y:l});
    const s1 = age>=start ? save:0, s2 = age>=start+10 ? save:0;
    d = d*(1+as.dep/100)+s1; n = n*(1+r/100)+s1; l = l*(1+r/100)+s2;
  }
  R.lines=lines;
  // Level 2 goals
  const g2=c.l2, items=[];
  if(g2.retire.on){
    const ra=g2.retire.age, nY=Math.max(0,as.life-ra), dY=Math.max(0,ra-b.age);
    const need=gpv(g2.retire.monthly*12,as.gL,r,nY,dY,beg);
    let pension=0;
    if(c.type==='cn') pension=gpv(g2.pension*12,as.gL,r,nY,dY,beg);
    if(c.type==='hk') pension=g2.mpf;
    items.push({key:'retire',label:'退休養老',need,have:g2.retire.have+pension,note:c.type==='hk'?'已包括強積金':c.type==='cn'?'已包括社保':''});
  }
  if(g2.edu.on){
    g2.edu.kids.forEach((k,i)=>{
      const dY=Math.max(0,k.start-k.age);
      items.push({key:'edu'+i,label:(k.name||('孩子'+(i+1)))+' 教育金',need:gpv(k.cost,as.gE,r,k.years,dY,true),have:k.have});
    });
  }
  if(g2.med.on) items.push({key:'med',label:'醫療儲備',need:g2.med.amount,have:g2.med.have});
  if(g2.house.on) items.push({key:'house',label:'置業首期',need:g2.house.amount*Math.pow((1+as.gL/100)/(1+r/100),g2.house.years),have:g2.house.have});
  const eduNeed = items.filter(x=>x.key.startsWith('edu')).reduce((s,x)=>s+Math.max(0,x.need-x.have),0);
  const lifeNeed2 = Math.max(0, gpv(spendY,as.gL,r,g2.supportYears,0,beg) + g2.debts + eduNeed - b.savings);
  const ciNeed2 = gpv(incY,as.gL,r,g2.ciYears,0,true) + gpv(g2.medOOP,as.gM,r,g2.ciYears,0,true);
  items.push({key:'life',label:'壽險（需求分析法）',need:lifeNeed2,have:g2.lifeCover,note:'參考：倍數法約為年收入10倍'});
  items.push({key:'ci',label:'重疾',need:ciNeed2,have:g2.ciCover});
  R.l2=items; R.multiple=incY*10;
  const gapSave = items.filter(x=>!['life','ci'].includes(x.key)).reduce((s,x)=>s+Math.max(0,x.need-x.have),0);
  const yrs = Math.max(1,(g2.retire.on?g2.retire.age:65)-b.age), rr=r/100;
  R.gapSave=gapSave; R.yrsSave=yrs;
  R.annualToClose = gapSave>0 ? (rr>0 ? gapSave*rr/(1-Math.pow(1+rr,-yrs))/(1+rr) : gapSave/yrs) : 0;
  R.tomorrow2 = {
    income: b.spend>0 ? b.savings/b.spend : 0,
    ill: b.spend>0 ? Math.max(0,b.savings+g2.ciCover-g2.medOOP*g2.ciYears)/b.spend : 0,
    death: b.spend>0 ? Math.max(0,b.savings+g2.lifeCover-g2.debts)/b.spend : 0
  };
  // yield comparison (mainland)
  const P=c.cmp.principal, N=c.cmp.years, fxY=c.cmp.fx/100;
  R.cmp=[
    {k:'定期存款',r:as.dep},{k:'國債',r:c.cmp.tb},{k:'大額存單',r:c.cmp.cd},
    {k:'美元方案（保證部分）',r:c.cmp.guar,usd:true},{k:'美元方案（演示，含非保證）',r:c.cmp.illus,usd:true}
  ].map(x=>{
    const pts=[]; for(let t=0;t<=N;t++){ let v=P*Math.pow(1+x.r/100,t); if(x.usd) v*=Math.pow(1+fxY,t); pts.push({x:t,y:v}); }
    return {...x,pts,final:pts[pts.length-1].y};
  });
  // Level 3
  const L=c.l3, A=L.assets.map(a=>({...a,usd:assetUSD(c,a),pl:poolOf(a)}));
  const personal=A.filter(a=>a.owner!=='company');
  const tot = personal.reduce((s,a)=>s+a.usd,0), totAll=A.reduce((s,a)=>s+a.usd,0);
  const tiers={A:0,B:0,C:0,D:0}; personal.forEach(a=>tiers[a.liq]=(tiers[a.liq]||0)+a.usd);
  const quick=tiers.A+tiers.B;
  const fac={}; personal.forEach(a=>{const f=factorOf(a); if(f) fac[f]=(fac[f]||0)+a.usd;});
  let topF=null,topV=0; Object.entries(fac).forEach(([k,v])=>{if(v>topV){topV=v;topF=k}});
  const reg={}; personal.forEach(a=>reg[a.loc]=(reg[a.loc]||0)+a.usd);
  let topR=null,topRV=0; Object.entries(reg).forEach(([k,v])=>{if(v>topRV){topRV=v;topR=k}});
  const ccyM={}; personal.forEach(a=>ccyM[a.ccy]=(ccyM[a.ccy]||0)+a.usd);
  const st=L.stress;
  const stressed = personal.reduce((s,a)=>{
    let drop=a.hc||0;
    if(['上市股權','非上市股權（本企業）','股票基金債券'].includes(a.cat)) drop=Math.max(drop,st.eq);
    if(['投資房產','自住房產'].includes(a.cat)) drop=Math.max(drop,st.re);
    let v=a.usd*(1-drop/100); if(a.ccy==='CNY') v*=(1-st.fx/100); return s+v;
  },0);
  const fxLoss = personal.filter(a=>a.ccy==='CNY').reduce((s,a)=>s+a.usd,0)*st.fx/100;
  const mines=L.mines, mineCount=['guar','pledge','suit','marital'].filter(k=>mines[k].on).length;
  const mineAmt=['guar','pledge','suit'].reduce((s,k)=>s+(mines[k].on?mines[k].amt:0),0);
  const estate = L.need.tax.on ? Math.max(0,(tot-L.need.tax.ex)*L.need.tax.rate/100) : 0;
  const lifeNeed = Math.max(0, gpv(spendY,as.gL,r,L.need.supportYears,0,beg) + estate + L.need.emergency + L.debts - (L.need.offset?L.need.reserve:0));
  const hlv = gpv(incY*(1-L.need.selfPct/100),as.gL,r,Math.max(0,L.need.retireAge-b.age),0,false);
  const ciNeed = gpv(spendY,as.gL,r,L.need.ciYears,0,true)+gpv(L.need.medOOP,as.gM,r,L.need.ciYears,0,true)+L.need.ciBuffer;
  const retNeed = gpv(L.need.retireMonthly*12,as.gL,r,Math.max(0,as.life-L.need.retireAge),Math.max(0,L.need.retireAge-b.age),beg);
  const gaps=[
    {key:'life',label:'壽險',need:lifeNeed,have:c.l2.lifeCover},
    {key:'ci',label:'重疾',need:ciNeed,have:c.l2.ciCover},
    {key:'retire',label:'本人養老',need:retNeed,have:L.need.retireHave}
  ];
  L.members.forEach((m,i)=>{
    if(m.role==='配偶'){
      const s=Math.max(m.age,L.need.spouseStart);
      gaps.push({key:'sp'+i,label:(m.name||'配偶')+' 生活資金',need:gpv(L.need.spouseMonthly*12,as.gL,r,Math.max(0,as.life-s),Math.max(0,L.need.spouseStart-m.age),beg),have:m.have||0});
    }
    if(m.role==='子女'){
      const s=Math.max(m.age,L.need.kidStart);
      gaps.push({key:'kid'+i,label:(m.name||'子女')+' 生活資金',need:gpv(L.need.kidMonthly*12,as.gL,r,Math.max(0,as.life-s),Math.max(0,L.need.kidStart-m.age),beg),have:m.have||0});
    }
  });
  const poolSum = k => A.filter(a=>a.pl===k).reduce((s,a)=>s+a.usd,0);
  const legacyNeed = L.need.legacy + estate;
  if(legacyNeed>0) gaps.push({key:'legacy',label:'傳承',need:legacyNeed,have:poolSum('legacy')});
  const monthsL3 = b.spend>0 ? quick/b.spend : 0;
  // radar
  const step=(v,th,asc)=>{ // th descending thresholds for 5,4,3,2
    if(asc){ if(v>=th[0])return 5; if(v>=th[1])return 4; if(v>=th[2])return 3; if(v>=th[3])return 2; return 1; }
    if(v<th[0])return 5; if(v<th[1])return 4; if(v<th[2])return 3; if(v<th[3])return 2; return 1;
  };
  const conc = tot?topV/tot*100:0, regPct=tot?topRV/tot*100:0;
  const lifeRatio = lifeNeed>0?c.l2.lifeCover/lifeNeed*100:100, ciRatio=ciNeed>0?c.l2.ciCover/ciNeed*100:100;
  const prot=Math.min(lifeRatio,ciRatio);
  const ent=L.ent, sep=1+[ent.noGuar,ent.separate,ent.homeApart,ent.indep].filter(Boolean).length;
  const lg=L.legacyChk, lgN=[lg.will,lg.bene,lg.trust,lg.knows,lg.plan].filter(Boolean).length;
  const retireOK = retNeed<=L.need.retireHave;
  const hc=L.healthChk, hN=1+[hc.med,hc.ci,retireOK,hc.ltc].filter(Boolean).length;
  const auto={
    liq:step(monthsL3,[24,12,6,3],true), conc:step(conc,[30,50,70,85],false), sep, prot:step(prot,[100,75,50,25],true),
    legacy:Math.max(1,lgN), region:step(regPct,[50,65,80,90],false),
    debt:Math.max(1,5-mineCount-(L.debts>quick?1:0)), health:Math.min(5,hN)
  };
  const radar={}; Object.keys(auto).forEach(k=>{const o=L.ovr[k]; radar[k]= (o&&o.s)?+o.s:auto[k];});
  const safeTarget=b.spend*L.safeMonths;
  // asset cash flow: income vs holding cost, with policy scenarios
  const cf=L.cf||{holdTax:0,divCut:0,transTax:0,transEx:0};
  const isRE=a=>a.cat==='投資房產'||a.cat==='自住房產';
  const isEq=a=>['上市股權','非上市股權（本企業）','股票基金債券'].includes(a.cat);
  const kindOf=x=>x>0?'make':x<0?'burn':'hold';
  const flows=personal.map(a=>{
    const fr=rateOf(c,a.ccy), inc=(+a.inc||0)*10000/fr, cost=(+a.cost||0)*10000/fr;
    const drop=isRE(a)?st.re:isEq(a)?st.eq:0, val2=a.usd*(1-drop/100);
    const inc2=inc*(1-(isEq(a)?cf.divCut:0)/100), cost2=cost+(isRE(a)?val2*cf.holdTax/100:0);
    const net=inc-cost, net2=inc2-cost2;
    return {name:a.name||a.cat,cat:a.cat,liq:a.liq,usd:a.usd,val2,inc,cost,net,inc2,cost2,net2,
      y:a.usd?net/a.usd:0,y2:val2?net2/val2:0,kind:kindOf(net),kind2:kindOf(net2),own:!!(a.biz||a.cat==='非上市股權（本企業）'),loan:!!a.loan,re:isRE(a),eq:isEq(a)};
  });
  const sumF=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
  const pas={base:sumF(flows,x=>x.net),stress:sumF(flows,x=>x.net2),stressEx:sumF(flows.filter(x=>!x.own),x=>x.net2)};
  const kinds={make:0,hold:0,burn:0}; flows.forEach(f=>kinds[f.kind2]+=f.val2);
  const transBase=sumF(flows.filter(f=>f.re||f.eq),f=>f.val2);
  const transTax=Math.max(0,transBase-(cf.transEx||0))*cf.transTax/100;
  const cfR={flows,pas,kinds,cov:spendY?pas.stress/spendY:0,covEx:spendY?pas.stressEx/spendY:0,
    transBase,transTax,quick,transGap:Math.max(0,transTax-quick),scen:{...cf,re:st.re,eq:st.eq},
    stressed:!!(cf.holdTax||cf.divCut)};
  R.l3={A,tot,totAll,tiers,quick,monthsL3,topF,topV,conc,topR,regPct,reg,ccyM,stressed,fxLoss,mineCount,mineAmt,estate,
    lifeNeed,hlv,ciNeed,retNeed,gaps,auto,radar,retireOK,lifeRatio,ciRatio,cf:cfR,
    pools:{safe:poolSum('safe'),growth:poolSum('growth'),legacy:poolSum('legacy'),home:poolSum('home'),business:poolSum('business'),safeTarget,legacyNeed,
      growthBiz:A.filter(a=>a.pl==='growth'&&a.biz).reduce((s,a)=>s+a.usd,0)},
    tomorrow:{
      income: monthsL3,
      ill: b.spend>0?Math.max(0,quick+c.l2.ciCover-L.need.medOOP*L.need.ciYears)/b.spend:0,
      death: b.spend>0?Math.max(0,quick+c.l2.lifeCover-estate-L.debts)/b.spend:0,
      biz: b.spend>0?Math.max(0,personal.filter(a=>(a.liq==='A'||a.liq==='B')&&!a.biz).reduce((s,a)=>s+a.usd,0)-mineAmt)/b.spend:0
    }};
  return R;
}

function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lineChart(series,{w=720,h=300,yfmt,xfmt=x=>x,marker}={}){
  const pl=64,pr=16,pt=14,pb=34, W=w-pl-pr, H=h-pt-pb;
  const xs=series.flatMap(s=>s.pts.map(p=>p.x)), ys=series.flatMap(s=>s.pts.map(p=>p.y));
  const x0=Math.min(...xs), x1=Math.max(...xs); let y0=Math.min(0,...ys), y1=niceMax(Math.max(...ys));
  if(y0<0) y0=-niceMax(-y0);
  const X=x=>pl+(x1===x0?0:(x-x0)/(x1-x0)*W), Y=y=>pt+H-(y-y0)/(y1-y0)*H;
  let g='';
  for(let i=0;i<=4;i++){ const v=y0+(y1-y0)*i/4; g+=`<line x1="${pl}" x2="${pl+W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${yfmt(v)}</text>`; }
  const span=x1-x0, stepX=span<=10?1:span<=25?5:10;
  for(let x=Math.ceil(x0/stepX)*stepX;x<=x1;x+=stepX){ g+=`<text x="${X(x)}" y="${pt+H+22}" text-anchor="middle" font-size="12" fill="var(--muted)">${xfmt(x)}</text>`; }

function viewForm(){
  const c=C(), st=stepsOf(c);
  ui.step=Math.min(ui.step,st.length-1);
  const head=`<section class="card"><span class="eyebrow">第${c.level}層　${LEVELS[c.level][0]}</span><h1>${st[ui.step]}</h1>${c.example?'<p class="note"><span class="pill ex">示例資料</span> 這是示範用的虛構數字，正式使用請新增客戶。</p>':''}
  ${st.length>1?`<div class="steps">${st.map((s,i)=>`<button class="step" data-step="${i}" aria-current="${i===ui.step}">${i+1}. ${s}</button>`).join('')}</div>`:''}</section>`;
  let body='';
  if(c.level===1) body=formBasic(true);
  else if(c.level===2) body=[()=>formBasic(false),formGoals,formResources,formAssump][ui.step]();
  else body=[formMembers,formAssets,formLiab,formEnt,formNeeds,formAssump][ui.step]();
  return head+body;
}

function compoundCard(c,R){
  const s=[{name:'只放定存（'+c.as.dep+'%）',color:'var(--muted)',pts:R.lines.dep,dash:true},{name:'現在開始存（'+R.r+'%）',color:'var(--accent)',pts:R.lines.now,area:true,w:3},{name:'晚 10 年開始（'+R.r+'%）',color:'var(--gold)',pts:R.lines.late}];
  const end=R.lines.now.length-1, last=x=>x[end].y;
  return `<section class="card"><span class="eyebrow">複利的威力</span><h2>同樣的錢，早存、晚存、只放定存</h2>
  ${lineChart(s,{yfmt:v=>fmtW(v,0),xfmt:x=>x+'歲'})}
  <div class="big">${tile('現在開始，到 '+R.lines.now[end].x+' 歲',fmtW(last(R.lines.now)),ccyLabel(),'ok','asm')}${tile('晚 10 年開始',fmtW(last(R.lines.late)),'少了 '+fmtW(last(R.lines.now)-last(R.lines.late)),'mid','asm')}${tile('只放定存',fmtW(last(R.lines.dep)),'少了 '+fmtW(last(R.lines.now)-last(R.lines.dep)),'bad','asm')}</div>
  <p class="note">包括現有存款 ${money(c.basic.savings)}，每月存 ${money(c.l1.monthly)}。回報率為假設，不代表任何產品的保證回報。</p></section>`;
}
// 三個回報率情景並排：同一份資料，只換回報率，看結果差多少
function scenCard(c){
  const rows=[['pess','悲觀'],['base','基本'],['opt','樂觀']].map(([k,t])=>{
    const cc=JSON.parse(JSON.stringify(c)); cc.as.scen=k; return {k,t,r:c.as.r[k],R:compute(cc)};
  });
  const gapSum=items=>items.reduce((s,x)=>s+Math.max(0,x.need-x.have),0);
  let cols=[], val=[];
  if(c.level===1){
    const e=rows[0].R.lines.now.length-1;
    cols=[`現在開始存，到 ${rows[0].R.lines.now[e].x} 歲累積`];
    val=x=>[x.R.lines.now[e].y];
  }else if(c.level===2){
    cols=['儲蓄類目標缺口','補足每年約需存','保障缺口（壽險＋重疾）'];
    val=x=>[x.R.gapSave,x.R.annualToClose,gapSum(x.R.l2.filter(i=>i.key==='life'||i.key==='ci'))];
  }else{
    cols=['各資金池缺口合計','其中保障（壽險＋重疾）'];
    val=x=>[gapSum(x.R.l3.gaps),gapSum(x.R.l3.gaps.filter(i=>i.key==='life'||i.key==='ci'))];
  }
  return `<section class="card"><span class="eyebrow">三個情景並排${srcTag('asm')}</span><h2>回報率不同，結果差多少</h2>
  <div class="tbl"><table class="scen-t"><tr><th>情景</th>${cols.map(t=>`<th>${t}</th>`).join('')}</tr>
  ${rows.map(x=>`<tr class="${x.k===c.as.scen?'cur':''}"><td>${x.t}（${x.r}%）</td>${val(x).map(v=>`<td>${fmtW(v)}</td>`).join('')}</tr>`).join('')}</table></div>
  <p class="note">單位：${ccyLabel()}。綠底是目前使用的情景。其他資料完全相同，只換回報率。回報率是假設，不代表任何產品的保證回報。</p></section>`;
}
function cmpCard(c,R){
  const cols=['var(--muted)','var(--warn)','var(--gold)','var(--accent)','var(--good)'];
  const s=R.cmp.map((x,i)=>({name:x.k,color:cols[i],pts:x.pts,dash:i<3,w:i>=3?3:2}));
  return `<section class="card"><span class="eyebrow">收益差對比</span><h2>${money(c.cmp.principal)} 放 ${c.cmp.years} 年</h2>${lineChart(s,{yfmt:v=>fmtW(v,0),xfmt:x=>'第'+x+'年'})}
  <div class="tbl"><table><tr><th>方式</th><th>年回報</th><th>${c.cmp.years} 年後</th><th>增加</th></tr>${R.cmp.map(x=>`<tr><td class="t">${x.k}</td><td>${x.r}%</td><td>${fmtW(x.final)}</td><td>${fmtW(x.final-c.cmp.principal)}</td></tr>`).join('')}</table></div>
  <p class="note">美元方案已按每年匯率變化 ${c.cmp.fx}% 換算回人民幣。非保證部分可能高於或低於演示，請以建議書為準。內地客戶需親身到香港簽署保單。</p></section>`;
}

  const cols=['var(--accent)','var(--gold)','var(--risk)'];
  const series=st.map((x,i)=>({name:x.p.name+' 退保 IRR',color:cols[i],pts:x.s.years.filter(y=>y.irrS!=null&&y.y>=3).map(y=>({x:y.y,y:y.irrS*100}))})).filter(s=>s.pts.length>1);

  st.forEach(x=>{
    const rows=x.s.years.filter(y=>keys.includes(y.y)||y===x.s.years[x.s.years.length-1]);

    h+=`<section class="card"><h2>${esc(x.p.name)}</h2><div class="tbl"><table><tr><th>年度</th><th>累計保費</th><th>累計提取</th><th>退保價值</th><th>退保 IRR</th><th>身故 IRR</th><th>保障槓桿</th><th>總回報倍數</th></tr>

    ${cost?`<p class="note">每 100 萬保額的年保費成本：約 ${Math.round(cost).toLocaleString()}（${x.p.ccy}，按第 1 年身故賠償計）。</p>`:''}

  });

}

  const c=C(), R=compute(c); let sum=[], reco=[], refer=[], charts='';
  if(c.level===1){
    sum.push(`收入停止後，現有的錢大約可以支撐 ${mo(R.monthsL1)} 個月。`);
    sum.push(`按每年通脹 ${c.as.gL}% 計，今天的 ${money(c.basic.savings)}，20 年後的購買力約等於今天的 ${money(R.pp[1].v)}。`);
    const e=R.lines.now.length-1; sum.push(`每月存 ${money(c.l1.monthly)}，現在開始和晚 10 年開始，到 ${R.lines.now[e].x} 歲相差約 ${money(R.lines.now[e].y-R.lines.late[e].y)}。`);
    reco=['先建立至少 6 個月家庭支出的備用金。','把每月儲蓄變成自動扣款，不靠意志力。','下一步做目標規劃，算清退休、教育和保障各差多少。'];
    charts=compoundCard(c,R)+scenCard(c);
  }
  if(c.level===2){
    const g=R.l2.map(x=>({...x,gap:Math.max(0,x.need-x.have)})).sort((a,b)=>b.gap-a.gap);
    sum.push(`收入中斷時，家裡的錢大約可以撐 ${mo(R.tomorrow2.income)} 個月；身故時約 ${mo(R.tomorrow2.death)} 個月。`);
    if(g[0]&&g[0].gap>0) sum.push(`最大的缺口是「${g[0].label}」，約 ${money(g[0].gap)}。`);
    sum.push(R.gapSave>0?`要補足儲蓄類目標，${R.yrsSave} 年內每年約需存 ${money(R.annualToClose)}。`:'儲蓄類目標目前已經足夠。');
    g.filter(x=>x.gap>0).slice(0,3).forEach(x=>reco.push(x.key==='life'||x.key==='ci'?`補足${x.label}保障缺口約 ${money(x.gap)}。`:`為「${x.label}」建立專款專用的儲蓄，缺口約 ${money(x.gap)}。`));
    if(!reco.length) reco.push('目前各目標大致足夠，建議每年檢視一次假設和進度。');
    charts=`<section class="card"><h2>缺口</h2>${gapBars(R.l2)}</section>`+scenCard(c)+(c.type==='cn'?cmpCard(c,R):'')+compoundCard(c,R);
  }
  if(c.level===3){
    const L=R.l3, weak=ORDER.map(k=>[k,L.radar[k]]).sort((a,b)=>a[1]-b[1]).filter(x=>x[1]<=3).slice(0,3);
    const low=RADAR.filter(([k])=>L.radar[k]<=2).map(x=>x[1]);
    sum.push(`家庭總資產約 ${money(L.tot)}，其中 30 天內可動用的只有 ${money(L.quick)}，可支撐約 ${mo(L.monthsL3)} 個月家庭支出。`);
    if(L.topF) sum.push(`最大的單一風險來源是「${L.topF}」，佔家庭資產約 ${Math.round(L.conc)}%。`);
    sum.push(`資產每年淨收入約 ${money(L.cf.pas.stress)}，可覆蓋家庭支出的 ${pct(L.cf.cov,0)}；不計本企業分紅只有 ${pct(L.cf.covEx,0)}。`);
    sum.push(low.length?`需要優先處理的方面：${low.join('、')}。`:'各方面沒有嚴重弱項，建議維持定期檢視。');
    reco=weak.length?weak.sort((a,b)=>ORDER.indexOf(a[0])-ORDER.indexOf(b[0])).map(([k])=>ADVICE[k].replace('{m}',c.l3.safeMonths)):['目前結構健康，建議每年檢視一次。'];
    if(L.cf.kinds.burn>0||L.cf.covEx<.5) reco.push('盤點不生錢的資產：耗錢資產考慮出租、出售或逐步退出，用 3 至 5 年把一部分資產轉為能產生現金流的資產。');
    if(L.cf.transGap>0) reco.push('為可能出台的贈與稅或遺產稅預留流動資金，避免傳承時被迫低價賣出房產或股權。');
    if(L.estate||c.l3.members.some(m=>m.taxRes&&m.taxRes!=='內地')||c.l3.members.some(m=>m.loc==='海外')) refer.push('持牌稅務師：跨境稅務居民身份及申報安排');
    if(!c.l3.legacyChk.will||!c.l3.legacyChk.trust) refer.push('律師／信託顧問：遺囑及信託架構');
    if(L.mineCount) refer.push('律師：擔保、質押、訴訟或婚姻財產風險評估');
    charts=`<section class="card"><h2>風險雷達圖</h2>${radarChart(L.radar)}${RADAR.filter(([k])=>c.l3.ovr[k]&&c.l3.ovr[k].s).map(([k,t])=>`<p class="note">${t}：已按面談判斷調整為 ${c.l3.ovr[k].s} 分。${esc(c.l3.ovr[k].why||'')}</p>`).join('')}</section>
      <section class="card"><h2>四池兩牆</h2>${poolsChart(L.pools,L)}</section>
      <section class="card"><h2>資產可用性</h2>${L.tot?tierBar(L.tiers,L.tot):''}</section>
      ${cfCard(c,L.cf,false)}
      <section class="card"><h2>各資金池缺口</h2>${gapBars(L.gaps)}</section>`+scenCard(c);
  }
  const asm=[`生活通脹 ${c.as.gL}%`,`教育通脹 ${c.as.gE}%`,`醫療通脹 ${c.as.gM}%`,`回報率 ${R.r}%（${{pess:'悲觀',base:'基本',opt:'樂觀'}[c.as.scen]}情景）`,`計劃到 ${c.as.life} 歲`,`每年的錢${c.as.begin?'年初':'年底'}領取`,`匯率 1 美元 = ${c.fx.CNY} 人民幣 = ${c.fx.HKD} 港元`];
  return {sum,reco,refer,charts,asm,R};
}
function viewReport(){
  const c=C(), r=buildReport();
  return `<section class="card summary"><span class="eyebrow">財富診斷報告｜${new Date().toLocaleDateString('zh-HK')}</span><h1>${esc(c.name)}</h1>${c.example?'<p class="note"><span class="pill ex">示例資料</span></p>':''}
  ${r.sum.map(s=>`<p>${s}</p>`).join('')}</section>
  <section class="card"><h2>最重要的建議</h2><ol class="reco">${r.reco.map(x=>`<li><span>${x}</span></li>`).join('')}</ol></section>
  <section class="card sunk">${srcLegend()}</section>
  ${r.charts}
  <section class="card"><h2>假設條件</h2><p class="lead">${r.asm.join('；')}。</p></section>
  ${r.refer.length?`<section class="card"><h2>建議轉介</h2><ul>${r.refer.map(x=>`<li>${x}</li>`).join('')}</ul></section>`:''}
  <section class="card sunk"><h3>免責聲明</h3><p class="note">本報告根據客戶提供的資料及上列假設計算，僅供規劃討論參考，不構成投資、稅務或法律意見。回報率、通脹率及匯率均為假設，實際結果可能不同。保險產品的非保證利益並無保證。</p></section>
  <section class="card noprint"><div class="row"><button class="btn pri" data-act="print">列印／存成 PDF</button><button class="btn" data-act="dlreport">下載報告網頁檔</button><button class="btn" data-act="copyreport">複製文字摘要</button></div><p class="note">「列印／存成 PDF」：在列印預覽用兩指放大，就會變成 PDF，可以分享或儲存。如果這個 App 不支援列印，就用「下載報告網頁檔」。</p></section>`;
}
function reportFile(){
  const c=C(), html=$('#app').innerHTML.replace(/<section class="card noprint">[\s\S]*?<\/section>/,'');
  const css=document.querySelector('style').textContent;
  return `<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.name)} 財富診斷報告</title><style>${css}
  :root{color-scheme:light} body{margin:0} main{padding-bottom:40px} .card{break-inside:avoid;animation:none} @media print{body{background:#fff}}</style></head><body data-theme="light"><main>${html}</main></body></html>`.replace('<body data-theme="light">','<body>').replace('<html lang="zh-HK">','<html lang="zh-HK" data-theme="light">');
}

/* ---------- events ---------- */
function toast(t){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>e.hidden=true,2400); }
function touch(){ C().updated=Date.now(); save(); }
function readVal(el){
  const t=el.dataset.t;
  if(t==='bool') return el.checked;
  if(t==='text') return el.value;
  if(t==='sel'){ const v=el.value; return v==='true'?true:v==='false'?false:v; }
  const n=parseFloat(el.value); const v=isFinite(n)?n:0;
  return t==='money'? v*10000/dispRate() : v;
}
function onField(e){
  const el=e.target; if(!el.dataset||!el.dataset.k) return;
  setP(C(),el.dataset.k,readVal(el)); touch();
  if(el.dataset.k==='name') renderBar();
  if(el.dataset.live){
    const lbl=document.getElementById(el.id+'_v');
    if(lbl){ const v=getP(C(),el.dataset.k); lbl.textContent = el.dataset.t==='money'?money(v): (el.dataset.k.includes('Age')||el.dataset.k.endsWith('.age')?v+' 歲':el.dataset.k.includes('Years')?v+' 年':v+'%'); }
    if(ui.view==='results') renderOut(); if(ui.view==='policies') renderPlansOut();
  }
  if(e.type==='change' && el.dataset.rr) render(true);
  if(e.type==='change' && el.dataset.k.startsWith('fx.')) {}
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{ if(e.target.dataset&&(e.target.dataset.rr||e.target.dataset.t==='sel'||e.target.dataset.t==='bool')) onField(e); });

async function dl(filename,data){
  try{
    const type=filename.endsWith('.json')?'application/json':'text/html';
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));
    a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000);
    toast('已下載，請到「檔案」App 查看');
  }catch(e){ toast('這裡不能下載，請改用「複製」'); }
}
async function copy(text,okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast(okMsg);}catch(x){toast('未能複製');} ta.remove(); }
}
function importData(txt){
  try{ const d=JSON.parse(txt); if(!d||!d.clients) throw 0; let n=0; Object.values(d.clients).forEach(c=>{ fix(c); S.clients[c.id]=c; n++; }); if(!S.cur||!S.clients[S.cur]) S.cur=Object.keys(S.clients)[0]; save(); render(); toast(`已還原 ${n} 位客戶`); }
  catch(e){ toast('備份內容無法讀取，請確認是完整的備份'); }
}
$('#importFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importData(r.result); r.readAsText(f); e.target.value=''; });

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset, c=C();
  if(d.ccy){ c.ccy=d.ccy; touch(); render(true); return; }
  if(d.scen){ c.as.scen=d.scen; touch(); render(true); return; }
  if(d.type){ c.type=d.type; touch(); render(true); return; }
  if(d.level){ c.level=+d.level; ui.step=0; touch(); render(true); return; }
  if(d.step!=null&&d.step!==''){ ui.step=+d.step; render(); return; }
  if(d.open){ S.cur=d.open; save(); render(); return; }
  if(d.del){ ui.confirmDel=d.del; render(true); return; }
  if(d.delok){ delete S.clients[d.delok]; ui.confirmDel=null; if(S.cur===d.delok) S.cur=Object.keys(S.clients)[0]||null; if(!S.cur){const n=newClient(false); S.clients[n.id]=n; S.cur=n.id;} save(); render(true); return; }
  if(d.rmkid){ c.l2.edu.kids.splice(+d.rmkid,1); touch(); render(true); return; }
  if(d.rmmem){ c.l3.members.splice(+d.rmmem,1); touch(); render(true); return; }
  if(d.rmasset){ c.l3.assets.splice(+d.rmasset,1); touch(); render(true); return; }
  if(d.rmplan){ c.plans.splice(+d.rmplan,1); touch(); render(true); return; }
  switch(d.act){
    case 'home': ui.view='home'; render(); break;
    case 'form': ui.view='form'; render(); break;
    case 'results': ui.view='results'; render(); break;
    case 'policies': ui.view='policies'; render(); break;
    case 'report': ui.view='report'; render(); break;
    case 'next': ui.step++; render(); break;
    case 'prev': ui.step=Math.max(0,ui.step-1); render(); break;
    case 'levelup': c.level=c.type==='ent'?3:2; ui.step=0; ui.view='form'; touch(); render(); break;
    case 'newclient': { const n=newClient(false); S.clients[n.id]=n; S.cur=n.id; save(); render(); setTimeout(()=>{const i=$('#f_name'); if(i){i.focus(); i.select();}},50); break; }
    case 'delcancel': ui.confirmDel=null; render(true); break;
    case 'addkid': c.l2.edu.kids.push({name:'孩子'+(c.l2.edu.kids.length+1),age:5,start:18,years:4,cost:c.l2.edu.kids[0]?c.l2.edu.kids[0].cost:0,have:0}); touch(); render(true); break;
    case 'addmem': c.l3.members.push({role:'子女',name:'',age:10,loc:'內地',taxRes:'',have:0}); touch(); render(true); break;
    case 'addasset': c.l3.assets.push({name:'',cat:'現金存款',v:0,ccy:'CNY',loc:'內地',liq:'A',hc:0,owner:'personal',biz:false,pool:'auto',rest:'',inc:0,cost:0,loan:false}); touch(); render(true); break;
    case 'addplan': c.plans.push({name:'方案 '+'ABC'[c.plans.length],ccy:'USD',text:''}); touch(); render(true); break;
    case 'export': dl(`財富體檢備份-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S)); break;
    case 'copybk': copy(JSON.stringify(S),'備份文字已複製'); break;
    case 'import': $('#importFile').click(); break;
    case 'pastebk': importData($('#bkText').value); break;
    case 'print': try{ window.print(); }catch(e){ toast('這個 App 不支援列印，請用下載'); } break;
    case 'dlreport': dl(`${c.name}-財富診斷報告.html`,reportFile()); break;
    case 'copyreport': { const r=buildReport(); copy(`${c.name} 財富診斷報告\n\n${r.sum.join('\n')}\n\n最重要的建議：\n${r.reco.map((x,i)=>(i+1)+'. '+x).join('\n')}\n\n假設：${r.asm.join('；')}`,'摘要已複製'); break; }
  }
});

load(); render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
